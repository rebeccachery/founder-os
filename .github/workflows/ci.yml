name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python · lint, types, tests, eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Tests
        run: pytest --cov --cov-report=term-missing:skip-covered

      - name: Ranker eval (synthetic fixture smoke test)
        run: python -m evals.run --fixture --today 2026-11-20 --out eval-report.md

      - name: Publish eval report to job summary
        run: cat eval-report.md >> "$GITHUB_STEP_SUMMARY"

  dashboard:
    name: Dashboard · types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
